<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<title>RaqeemOS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 400px;
    height: 400px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background: #0A0F1C;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
  }

  body::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: radial-gradient(ellipse at bottom, rgba(197, 168, 128, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    border-radius: 24px;
    filter: drop-shadow(0 0 20px rgba(197, 168, 128, 0.4));
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .title {
    color: #C5A880;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-top: 18px;
  }

  .tagline {
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    margin-top: 6px;
  }

  .loader-wrap {
    position: absolute;
    bottom: 45px;
    width: 200px;
    height: 2px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .loader {
    height: 100%;
    background: linear-gradient(90deg, #C5A880, #E8D5B5);
    width: 0%;
    animation: load 2.5s forwards ease-out;
  }

  @keyframes load {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  .loading-text {
    position: absolute;
    bottom: 25px;
    color: rgba(255, 255, 255, 0.4);
    font-size: 10px;
  }

  .version {
    position: absolute;
    bottom: 12px;
    right: 16px;
    color: rgba(255, 255, 255, 0.25);
    font-size: 9px;
  }
</style>
</head>
